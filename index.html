<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutube Поиск</title>
    <!-- ПОДКЛЮЧАЕМ ОФИЦИАЛЬНЫЙ СКРИПТ TELEGRAM WEB APP -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            font-size: 24px;
            color: #f2f2f2;
        }
        #movie-title {
            font-style: italic;
            color: #00cad3;
            margin-bottom: 25px;
            word-wrap: break-word;
        }
        .btn-rutube {
            background: #00cad3;
            color: #0f0f0f;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        .btn-rutube:active {
            transform: scale(0.98);
            background: #00a4ab;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Поиск медиафайла</h2>
        <div id="movie-title">Загрузка названия...</div>
        <button class="btn-rutube" onclick="openRutubeSearch()">Перейти на Rutube</button>
    </div>

    <script>
        // Инициализируем Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand(); // Разворачиваем окно на максимум
        }

        // Извлекаем переданное ботом название из строки URL-адреса
        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('title') || 'Неизвестный фильм';

        // Отображаем название на экране
        document.getElementById('movie-title').innerText = decodeURIComponent(movieTitle);

        function openRutubeSearch() {
            // Формируем чистую ссылку на поиск
            const searchUrl = `https://rutube.ru{movieTitle}`;

            // ИСПРАВЛЕНО: Если открыто в Телеграме, используем системный метод вызова ссылок
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(searchUrl);
            } else {
                // Если открыли просто в браузере, делаем обычный переход
                window.location.href = searchUrl;
            }
        }
    </script>
</body>
</html>
