<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Media Search Hub</title>
    <!-- Подключаем официальную библиотеку Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        /* Фоновое неоновое свечение */
        body::before {
            content: ''; position: absolute; width: 250px; height: 250px;
            background: rgba(0, 242, 254, 0.12); border-radius: 50%;
            filter: blur(80px); top: 15%; left: 10%; z-index: 0;
        }
        body::after {
            content: ''; position: absolute; width: 250px; height: 250px;
            background: rgba(255, 0, 127, 0.12); border-radius: 50%;
            filter: blur(80px); bottom: 15%; right: 10%; z-index: 0;
        }

        /* Главный неоновый контейнер */
        .container {
            width: 100%; max-width: 400px;
            background: rgba(21, 21, 33, 0.85); backdrop-filter: blur(10px);
            padding: 30px 20px; border-radius: 20px; text-align: center; z-index: 1;
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.1);
            animation: panelPulse 4s infinite alternate;
        }

        @keyframes panelPulse {
            0% { border-color: rgba(0, 242, 254, 0.25); box-shadow: 0 0 25px rgba(0, 242, 254, 0.1); }
            100% { border-color: rgba(255, 0, 127, 0.3); box-shadow: 0 0 30px rgba(255, 0, 127, 0.15); }
        }

        h1 { 
            margin-bottom: 5px; font-size: 22px; font-weight: 800;
            letter-spacing: 1.5px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        h1 span { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }
        .subtitle { font-size: 13px; color: #8a8a9e; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        /* Поле ввода */
        input {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #252538;
            font-size: 16px; background: #11111e; color: #fff; margin-bottom: 20px;
            text-align: center; outline: none; transition: all 0.3s ease;
        }
        input:focus { border-color: #00f2fe; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }

        /* Сетка кнопок */
        .buttons-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }

        .btn-platform {
            display: block; width: 100%; padding: 14px; border-radius: 12px; color: #fff;
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            text-decoration: none; text-align: center; transition: all 0.2s ease; border: 1px solid transparent;
        }
        .btn-platform:active { transform: scale(0.98); }

        .btn-rutube { background: rgba(0, 202, 211, 0.15); border-color: #00cad3; box-shadow: 0 0 10px rgba(0, 202, 211, 0.2); }
        .btn-rutube:hover { background: #00cad3; color: #05050a; box-shadow: 0 0 20px rgba(0, 202, 211, 0.6); }
        .btn-vk { background: rgba(0, 119, 255, 0.15); border-color: #0077ff; box-shadow: 0 0 10px rgba(0, 119, 255, 0.2); }
        .btn-vk:hover { background: #0077ff; color: #fff; box-shadow: 0 0 20px rgba(0, 119, 255, 0.6); }
        .btn-youtube { background: rgba(255, 0, 0, 0.15); border-color: #ff0000; box-shadow: 0 0 10px rgba(255, 0,  Red, 0.2); }
        .btn-youtube:hover { background: #ff0000; color: #fff; box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }

        /* Блок Истории Поиска */
        .history-box { border-top: 1px dashed rgba(255, 255, 255, 0.15); padding-top: 20px; text-align: left; }
        .history-title { font-size: 12px; font-weight: bold; color: #8a8a9e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .history-tags { display: flex; flex-wrap: wrap; gap: 8px; max-height: 120px; overflow-y: auto; }
        .history-tag {
            background: rgba(255, 0, 127, 0.08); border: 1px solid rgba(255, 0, 127, 0.4); color: #ff758c;
            padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s ease;
            white-space: nowrap; text-shadow: 0 0 5px rgba(255, 0, 127, 0.3);
        }
        .history-tag:hover { background: #ff007f; color: #fff; border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
    </style>
</head>
<body>

    <div class="container">
        <h1> Мульти <span>Поиск</span></h1>
        <div class="subtitle" id="statusText">Где хотите посмотреть тайтл?</div>
        
        <input type="text" id="searchInput" placeholder="Введите название...">
        
        <div class="buttons-grid">
            <!-- Чистые ссылки-кнопки (target="_blank" для полноценного открытия в новой вкладке браузера на ПК) -->
            <a href="https://rutube.ru" id="rutubeBtn" target="_blank" class="btn-platform btn-rutube" onclick="handlePlatformClick(event, 'rutube')">💚 Искать на Rutube</a>
            <a href="https://vk.com" id="vkBtn" target="_blank" class="btn-platform btn-vk" onclick="handlePlatformClick(event, 'vk')">💙 Искать в VK Видео</a>
            <a href="https://youtube.com" id="youtubeBtn" target="_blank" class="btn-platform btn-youtube" onclick="handlePlatformClick(event, 'youtube')">❤️ Искать на YouTube</a>
        </div>

        <div class="history-box">
            <div class="history-title">🔍 Что у нас нашли для просмотра:</div>
            <div class="history-tags" id="historyTags"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        window.addEventListener('load', () => {
            if (tg) {
                tg.ready();
                tg.expand();
            }
            
            // Выводим сохраненную локальную историю на экран
            renderHistory();

            // Проверяем, передан ли параметр title в URL (когда открываем через бота)
            const params = new URLSearchParams(window.location.search);
            const title = params.get("title");
            
            if (title) {
                const decodedTitle = decodeURIComponent(title);
                document.getElementById("searchInput").value = decodedTitle;
                
                // Сохраняем тайтл в блок истории внизу
                saveToHistory(decodedTitle);
                updateAllHrefs(decodedTitle);

                // ОФИЦИАЛЬНАЯ ЛОГИКА ДЛЯ БОТА: если открыли из Telegram, сразу автоматически перенаправляем на Rutube
                if (tg && tg.initData && tg.openLink) {
                    document.getElementById("statusText").innerText = "🚀 Перенаправление на Rutube...";
                    const encoded = encodeURIComponent(decodedTitle);
                    tg.openLink(`https://rutube.ru{encoded}`);
                    
                    // Закрываем окно WebApp сразу после перехода, чтобы не дублировать вкладки
                    setTimeout(() => { tg.close(); }, 150);
                }
            }
        });

        // Слушаем ручной ввод текста в поле (для режима работы на ПК)
        document.getElementById("searchInput").addEventListener("input", (e) => {
            updateAllHrefs(e.target.value);
        });

        // Функция мгновенной перестройки ссылок кнопок под текущий поисковый запрос
        function updateAllHrefs(query) {
            if (!query) return;
            const encoded = encodeURIComponent(query);
            document.getElementById("rutubeBtn").href = `https://rutube.ru{encoded}`;
            document.getElementById("vkBtn").href = `https://vk.com?q=${encoded}`;
            document.getElementById("youtubeBtn").href = `https://youtube.com{encoded}`;
        }

        // Ручной клик пользователя по кнопке (для режима работы на ПК)
        function handlePlatformClick(event, platform) {
            const query = document.getElementById("searchInput").value;
            if (!query) { event.preventDefault(); return; }

            saveToHistory(query);

            // Если кликнули вручную внутри Telegram WebApp
            if (tg && tg.openLink) {
                event.preventDefault(); // Запрещаем браузерный переход, отдавая управление Telegram API
                const encoded = encodeURIComponent(query);
                let targetUrl = `https://rutube.ru{encoded}`;
                if (platform === 'vk') targetUrl = `https://vk.com?q=${encoded}`;
                if (platform === 'youtube') targetUrl = `https://youtube.com{encoded}`;
                
                tg.openLink(targetUrl);
                setTimeout(() => { tg.close(); }, 100);
            }
        }

        // Сохранение и рендеринг истории во внутреннюю память устройства
        function saveToHistory(title) {
            if (!title || title.trim() === "" || title === "Неизвестный фильм") return;
            let history = JSON.parse(localStorage.getItem('anime_history')) || [];
            history = history.filter(item => item.toLowerCase() !== title.toLowerCase());
            history.unshift(title);
            if (history.length > 10) history.pop();
            localStorage.setItem('anime_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
