<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Anime Search</title>
    <!-- Подключаем официальную библиотеку Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Фоновое неоновое свечение */
        body::before {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(0, 242, 254, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            top: 20%;
            left: 15%;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255, 0, 127, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            bottom: 20%;
            right: 15%;
            z-index: 0;
        }

        /* Неоновый контейнер */
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(21, 21, 33, 0.85);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            z-index: 1;
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.1);
            animation: panelPulse 4s infinite alternate;
        }

        @keyframes panelPulse {
            0% { border-color: rgba(0, 242, 254, 0.25); box-shadow: 0 0 25px rgba(0, 242, 254, 0.1); }
            100% { border-color: rgba(255, 0, 127, 0.3); box-shadow: 0 0 30px rgba(255, 0, 127, 0.15); }
        }

        h1 { 
            margin-bottom: 25px; 
            font-size: 22px; 
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
        
        h1 span {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.6);
        }

        /* Поле ввода */
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #252538;
            font-size: 16px;
            background: #11111e;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }

        /* ИСПРАВЛЕНО: Ссылка оформлена как полноценная неоновая киберпанк-кнопка */
        .btn-neon {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #05050a;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .btn-neon:hover {
            background: linear-gradient(45deg, #ff007f, #ff758c);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
            transform: translateY(-2px);
        }

        .btn-neon:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎌 ПОИСК <span>АНИМЕ</span></h1>
        <input type="text" id="searchInput" placeholder="Введите название...">
        <!-- ИСПРАВЛЕНО: Теперь кнопка — это чистая ссылка, которая не блокируется Telegram -->
        <a href="#" id="rutubeBtn" class="btn-neon" onclick="handleLinkClick(event)">🔍 НАЙТИ НА RUTUBE</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        window.addEventListener('load', () => {
            if (tg) {
                tg.ready();
                tg.expand();
            }
            
            const params = new URLSearchParams(window.location.search);
            const title = params.get("title");
            
            if (title) {
                const decodedTitle = decodeURIComponent(title);
                document.getElementById("searchInput").value = decodedTitle;
                // Сразу же привязываем правильный URL к нашей кнопке-ссылке
                updateRutubeHref(decodedTitle);
            }
        });

        // Если пользователь решит отредактировать название руками, ссылка мгновенно обновится
        document.getElementById("searchInput").addEventListener("input", (e) => {
            updateRutubeHref(e.target.value);
        });

        // Функция формирования и записи ссылки в тег <a>
        function updateRutubeHref(query) {
            if (!query) return;
            const encoded = encodeURIComponent(query);
            document.getElementById("rutubeBtn").href = `https://rutube.ru{encoded}`;
        }

        // Обработка самого нажатия
        function handleLinkClick(event) {
            const query = document.getElementById("searchInput").value;
            if (!query) {
                event.preventDefault();
                return;
            }

            // ИСПРАВЛЕНО: Для Telegram WebApp принудительно открываем через openLink, для обычного браузера — по href
            if (tg && tg.openLink) {
                event.preventDefault(); // Запрещаем стандартный переход, отдавая приоритет API Telegram
                const encoded = encodeURIComponent(query);
                const finalUrl = `https://rutube.ru{encoded}`;
                
                tg.openLink(finalUrl);
                
                // Закрываем окно WebApp сразу после успешного клика
                setTimeout(() => {
                    tg.close();
                }, 100);
            }
        }
    </script>
</body>
</html>
