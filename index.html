<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мульти Поиск Аниме</title>
    <!-- Подключаем официальную библиотеку Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: #0a0a12;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
            font-size: 16px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
    </style>
</head>
<body>

    <div class="loader">🔍 Перенаправление на платформы просмотра...</div>

    <script>
        const tg = window.Telegram.WebApp;

        window.addEventListener('load', () => {
            if (tg) {
                tg.ready();
                tg.expand();
            }

            // 1. Считываем точное название аниме, переданное ботом из URL
            const params = new URLSearchParams(window.location.search);
            const title = params.get("title");

            if (title) {
                const decodedTitle = decodeURIComponent(title);
                
                // 2. Сохраняем тайтл в историю просмотров на устройстве
                saveToHistory(decodedTitle);

                // 3. Формируем прямые ссылки на результаты поиска видеофайлов
                const encoded = encodeURIComponent(decodedTitle);
                const urlRutube = `https://rutube.ru{encoded}`;
                const urlVk = `https://vk.com{encoded}`;
                const urlYandex = `https://yandex.ru{encoded}`;

                // ИСПРАВЛЕНО: Вместо генерации кнопок, мы сразу отправляем пользователя на Rutube.
                // Если нужно открыть выбор ссылок, Telegram требует использовать один чистый метод.
                if (tg && tg.openLink) {
                    // Открываем Rutube по умолчанию как основную платформу
                    tg.openLink(urlRutube);
                    
                    // Закрываем окно WebApp, чтобы оно не висело дубликатом в фоне
                    setTimeout(() => {
                        tg.close();
                    }, 100);
                } else {
                    // Фаллбэк для обычного браузера на ПК
                    window.location.replace(urlRutube);
                }
            }
        });

        // Функция сохранения аниме в историю локального хранилища
        function saveToHistory(title) {
            if (!title || title.trim() === "" || title === "Неизвестный фильм") return;
            
            let history = JSON.parse(localStorage.getItem('anime_search_history')) || [];
            history = history.filter(item => item.toLowerCase() !== title.toLowerCase());
            history.unshift(title);
            
            if (history.length > 15) history.pop();
            localStorage.setItem('anime_search_history', JSON.stringify(history));
        }
    </script>
</body>
</html>
