<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Anime Search</title>
    <!-- Подключаем официальную библиотеку Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Фоновое атмосферное свечение */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(0, 242, 254, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            top: 20%;
            left: 15%;
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 0, 127, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            bottom: 20%;
            right: 15%;
            z-index: 0;
        }

        /* Неоновый контейнер */
        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(21, 21, 33, 0.85);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            z-index: 1;
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.1), 
                        inset 0 0 15px rgba(0, 242, 254, 0.05);
            animation: panelPulse 4s infinite alternate;
        }

        /* Анимация легкого дыхания рамки */
        @keyframes panelPulse {
            0% { border-color: rgba(0, 242, 254, 0.25); box-shadow: 0 0 25px rgba(0, 242, 254, 0.1); }
            100% { border-color: rgba(255, 0, 127, 0.3); box-shadow: 0 0 30px rgba(255, 0, 127, 0.15); }
        }

        /* Заголовок с неоновым текстом */
        h1 { 
            margin-bottom: 25px; 
            font-size: 24px; 
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6),
                         0 0 20px rgba(0, 242, 254, 0.3);
        }
        
        h1 span {
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.6),
                         0 0 20px rgba(255, 0, 127, 0.3);
        }

        /* Неоновое поле ввода */
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #252538;
            font-size: 16px;
            background: #11111e;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.4),
                        inset 0 0 8px rgba(0, 242, 254, 0.1);
            background: #151528;
        }

        /* Киберпунк-ссылка в виде светящейся кнопки */
        .btn-link {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #05050a;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            border: none;
        }

        .btn-link:hover {
            background: linear-gradient(45deg, #ff007f, #ff758c);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
            transform: translateY(-2px);
        }

        .btn-link:active {
            transform: translateY(1px);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎌 ПОИСК <span>АНИМЕ</span></h1>
        <input type="text" id="searchInput" placeholder="Ожидание тайтла...">
        <a href="#" id="rutubeBtn" class="btn-link" onclick="search(event)">🔍 НАЙТИ НА RUTUBE</a>
    </div>

    <script>
        // Ждем полной инициализации интерфейса Telegram
        window.addEventListener('load', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            
            // Считываем параметры названия от бота
            const params = new URLSearchParams(window.location.search);
            const title = params.get("title");
            
            if (title) {
                const decodedTitle = decodeURIComponent(title);
                document.getElementById("searchInput").value = decodedTitle;
                updateLink(decodedTitle);
            }
        });

        // Слушаем изменения в инпуте, если пользователь захочет изменить название руками
        document.getElementById("searchInput").addEventListener("input", (e) => {
            updateLink(e.target.value);
        });

        // Функция динамического обновления ссылки на кнопке
        function updateLink(query) {
            if (!query) return;
            const encoded = encodeURIComponent(query);
            const btn = document.getElementById("rutubeBtn");
            btn.href = `https://rutube.ru{encoded}`;
        }

        function search(event) {
            const query = document.getElementById("searchInput").value;
            if (!query) {
                event.preventDefault();
                return;
            }

            // Безопасный вызов перехода Mini App в Telegram
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                event.preventDefault(); // Отменяем обычный переход браузера
                const encoded = encodeURIComponent(query);
                window.Telegram.WebApp.openLink(`https://rutube.ru{encoded}`);
            }
        }
    </script>
</body>
</html>
