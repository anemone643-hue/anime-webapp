<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аниме поиск</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #fff);
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #16213e);
            color: var(--tg-theme-text-color, #fff);
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #00c853;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        iframe {
            width: 100%;
            height: 70vh;
            border: none;
            border-radius: 10px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h1>🎌 Поиск аниме</h1>
    <input type="text" id="searchInput" placeholder="Введите название аниме...">
    <button onclick="search()">🔍 Найти на Rutube</button>
    <iframe id="rutubeFrame" style="display:none"></iframe>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const title = params.get("title");
        if (title) {
            document.getElementById("searchInput").value = title;
            search();
        }

        function search() {
            const query = document.getElementById("searchInput").value;
            if (!query) return;
            const encoded = encodeURIComponent(query);
            const frame = document.getElementById("rutubeFrame");
            frame.src = `https://rutube.ru/search/?query=${encoded}`;
            frame.style.display = "block";
        }
    </script>
</body>
</html>
