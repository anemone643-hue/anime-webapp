<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Anime Search</title>
    <!-- Библиотека Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a12;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        /* Неоновый фон */
        body::before {
            content: ''; position: absolute; width: 250px; height: 250px;
            background: rgba(0, 242, 254, 0.12); border-radius: 50%;
            filter: blur(80px); top: 15%; left: 10%; z-index: 0;
        }
        body::after {
            content: ''; position: absolute; width: 250px; height: 250px;
            background: rgba(255, 0, 127, 0.12); border-radius: 50%;
            filter: blur(80px); bottom: 15%; right: 10%; z-index: 0;
        }

        .container {
            width: 100%; max-width: 380px;
            background: rgba(21, 21, 33, 0.85); backdrop-filter: blur(10px);
            padding: 30px 20px; border-radius: 20px; text-align: center; z-index: 1;
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.1);
        }

        h1 { 
            margin-bottom: 20px; font-size: 22px; font-weight: 800;
            letter-spacing: 1.5px; text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        h1 span { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }

        /* Поле ввода */
        input {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #252538;
            font-size: 16px; background: #11111e; color: #fff; margin-bottom: 15px;
            text-align: center; outline: none;
        }
        input:focus { border-color: #00f2fe; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }

        /* Главная кнопка Искать */
        .btn-main {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(45deg, #ff007f, #ff758c);
            color: white; font-size: 16px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            transition: all 0.2s ease;
        }
        .btn-main:active { transform: scale(0.98); }

        /* Блок с результатами (ссылками) */
        .results-box {
            display: none; flex-direction: column; gap: 12px; margin-bottom: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 20px;
        }
        .results-title { font-size: 13px; color: #8a8a9e; text-transform: uppercase; margin-bottom: 5px; text-align: left;}

        .btn-platform {
            display: block; width: 100%; padding: 12px; border-radius: 10px; color: #fff;
            font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            text-decoration: none; text-align: center; border: 1px solid transparent; transition: all 0.2s ease;
        }

        .btn-rutube { background: rgba(0, 202, 211, 0.1); border-color: #00cad3; }
        .btn-rutube:hover { background: #00cad3; color: #000; }
        .btn-vk { background: rgba(0, 119, 255, 0.1); border-color: #0077ff; }
        .btn-vk:hover { background: #0077ff; }
        .btn-yandex { background: rgba(255, 204, 0, 0.1); border-color: #ffcc00; color: #ffcc00; }
        .btn-yandex:hover { background: #ffcc00; color: #000; }

        /* История */
        .history-box { border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 20px; text-align: left; }
        .history-title { font-size: 11px; font-weight: bold; color: #5a5a6e; text-transform: uppercase; margin-bottom: 10px; }
        .history-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .history-tag {
            background: rgba(0, 242, 254, 0.05); border: 1px solid rgba(0, 242, 254, 0.3); color: #00f2fe;
            padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Поиск <span>Аниме</span></h1>
        <p style="font-size: 12px; color: #666; margin-bottom: 15px;">Введи название и нажми кнопку ниже</p>
        
        <input type="text" id="searchInput" placeholder="Название аниме...">
        <button class="btn-main" onclick="startSearch()">🔍 Искать ссылки</button>
        
        <!-- СЮДА ВЫДАЮТСЯ ССЫЛКИ ДЛЯ ПЕРЕХОДА -->
        <div class="results-box" id="resultsBox">
            <div class="results-title">🍿 Ссылки для просмотра:</div>
            <a href="#" id="rutubeLink" target="_blank" class="btn-platform btn-rutube" onclick="openExternal(event, 'rutube')">Смотреть на Rutube</a>
            <a href="#" id="vkLink" target="_blank" class="btn-platform btn-vk" onclick="openExternal(event, 'vk')">Смотреть в VK Видео</a>
            <a href="#" id="yandexLink" target="_blank" class="btn-platform btn-yandex" onclick="openExternal(event, 'yandex')">Открыть в Яндекс Видео</a>
        </div>

        <div class="history-box">
            <div class="history-title">Что у нас нашли для просмотра:</div>
            <div class="history-tags" id="historyTags"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        window.addEventListener('load', () => {
            if (tg) { tg.ready(); tg.expand(); }
            renderHistory();

            // Если бот сам передал название в ссылку
            const params = new URLSearchParams(window.location.search);
            const title = params.get("title");
            if (title) {
                const decoded = decodeURIComponent(title);
                document.getElementById("searchInput").value = decoded;
                // Сразу генерируем ссылки и показываем блок
                generateLinks(decoded);
            }
        });

        // Функция запуска поиска по кнопке
        function startSearch() {
            const query = document.getElementById("searchInput").value.strip ? document.getElementById("searchInput").value.strip() : document.getElementById("searchInput").value;
            if (!query) return;
            saveToHistory(query);
            generateLinks(query);
        }

        // Функция генерации ссылок и показа блока на экране
        function generateLinks(query) {
            const encoded = encodeURIComponent(query);
            
            // Прописываем чистые ссылки в кнопки
            document.getElementById("rutubeLink").href = `https://rutube.ru{encoded}`;
            document.getElementById("vkLink").href = `https://vk.com{encoded}`;
            document.getElementById("yandexLink").href = `https://yandex.ru{encoded}`;
            
            // Показываем блок со ссылками на экране
            document.getElementById("resultsBox").style.display = "flex";
        }

        // Безопасное открытие ссылок для Telegram и ПК
        function openExternal(event, platform) {
            const query = document.getElementById("searchInput").value;
            if (!query) return;
            const encoded = encodeURIComponent(query);

            if (tg && tg.openLink) {
                event.preventDefault(); // Защита от дублирования вкладок
                let targetUrl = `https://rutube.ru{encoded}`;
                if (platform === 'vk') targetUrl = `https://vk.com{encoded}`;
                if (platform === 'yandex') targetUrl = `https://yandex.ru{encoded}`;
                
                tg.openLink(targetUrl);
            }
        }

        // Логика истории без опечаток
        function saveToHistory(title) {
            if (!title || title === "Неизвестный фильм") return;
            let history = JSON.parse(localStorage.getItem('anime_history')) || [];
            history = history.filter(item => item.toLowerCase() !== title.toLowerCase());
            history.unshift(title);
            if (history.length > 8) history.pop();
            localStorage.setItem('anime_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('anime_history')) || [];
            const container = document.getElementById('historyTags'); // ИСПРАВЛЕНО: строго маленькая буква d
            container.innerHTML = "";
            if (history.length === 0) {
                container.innerHTML = "<span style='font-size:11px; color:#444;'>История пуста</span>";
                return;
            }
            history.forEach(title => {
                const tag = document.createElement('div');
                tag.className = 'history-tag';
                tag.innerText = title;
                tag.onclick = () => {
                    document.getElementById("searchInput").value = title;
                    generateLinks(title);
                };
                container.appendChild(tag);
            });
        }
    </script>
</body>
</html>
