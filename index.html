<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аниме поиск</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #16213e;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; font-size: 20px; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            background: #fff;
            color: #000;
            margin-bottom: 12px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #00c853;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎌 Поиск аниме</h1>
        <input type="text" id="searchInput" placeholder="Введите название аниме...">
        <button onclick="search()">🔍 Найти на Rutube</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем то, что передал бот
        const params = new URLSearchParams(window.location.search);
        const title = params.get("title");
        
        if (title) {
            document.getElementById("searchInput").value = decodeURIComponent(title);
            // Сразу запускаем поиск, чтобы пользователю не нужно было кликать дважды
            search();
        }

        function search() {
            const query = document.getElementById("searchInput").value;
            if (!query) return;
            
            const encoded = encodeURIComponent(query);
            // ИСПРАВЛЕНО: Формируем точный поисковый URL Rutube с параметром запроса
            const rutubeSearchUrl = `https://rutube.ru{encoded}`;
            
            // ИСПРАВЛЕНО: Вместо iframe открываем ссылку системным методом Telegram
            if (tg.openLink) {
                tg.openLink(rutubeSearchUrl);
                tg.close(); // Закрываем пустое окно WebApp, так как поиск открылся в браузере
            } else {
                window.location.href = rutubeSearchUrl;
            }
        }
    </script>
</body>
</html>
